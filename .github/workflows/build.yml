name: Build and Publish

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Run tests
      run: mvn test || true

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultimate-boxing-game-jar
        path: target/*.jar
        retention-days: 30

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  publish-to-github-packages:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Publish to GitHub Packages
      run: mvn -B deploy -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-snapshot-from-branch:
    runs-on: ubuntu-latest
    # Optional: Enable this job by removing "false &&" from the condition below
    # This job is disabled by default to prevent version conflicts
    if: false && github.ref != 'refs/heads/main' && github.event_name == 'push'
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Extract branch name and create version suffix
      id: extract_branch
      run: |
        # Extract branch name and sanitize it for version string
        BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        # Replace invalid characters with hyphens
        SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g')
        echo "branch=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT
        echo "version_suffix=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

    - name: Set dynamic version
      run: |
        # Get the base version from pom.xml
        BASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        # Remove -SNAPSHOT if present
        BASE_VERSION=${BASE_VERSION%-SNAPSHOT}
        # Create new version with branch suffix
        NEW_VERSION="${BASE_VERSION}-${{ steps.extract_branch.outputs.version_suffix }}"
        echo "Setting version to: $NEW_VERSION"
        mvn versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false

    - name: Publish snapshot to GitHub Packages
      run: mvn -B deploy -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
